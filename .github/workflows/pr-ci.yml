# AI Assistance Disclosure: OpenAI Codex (GPT-6), 2026-10-18.
# Scope: Implemented the issue #42 pull-request CI foundation from the
# project author's approved design decisions.
# Author review: Pending project-author review.

name: PR CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  frontend_quality:
    name: frontend / static-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit and component tests
        run: npm test

      - name: Build
        run: npm run build

  supplier_quality:
    name: supplier / static-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: supplier-service
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supplier-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  user_build:
    name: user / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: user-service
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: user-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  supplier_integration:
    name: integration / supplier-stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: supplier-service
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supplier-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run live Supplier integration suite
        run: npm run test:integration

  supplier_ui_e2e:
    name: e2e / supplier-ui
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run live Supplier UI journey
        run: npm run test:e2e

      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: supplier-ui-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  ci_gate:
    name: CI / gate
    if: ${{ always() }}
    needs:
      - frontend_quality
      - supplier_quality
      - user_build
      - supplier_integration
      - supplier_ui_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to pass
        env:
          FRONTEND_RESULT: ${{ needs.frontend_quality.result }}
          SUPPLIER_RESULT: ${{ needs.supplier_quality.result }}
          USER_RESULT: ${{ needs.user_build.result }}
          INTEGRATION_RESULT: ${{ needs.supplier_integration.result }}
          E2E_RESULT: ${{ needs.supplier_ui_e2e.result }}
        run: |
          failed=0
          for result in \
            "$FRONTEND_RESULT" \
            "$SUPPLIER_RESULT" \
            "$USER_RESULT" \
            "$INTEGRATION_RESULT" \
            "$E2E_RESULT"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "At least one required CI job failed, was cancelled, or did not complete."
            exit 1
          fi

          echo "All required CI jobs passed."
