# Keep in sync with the dev proxy in vite.config.ts.

# Login speed limit (N2H1a): 30 attempts per minute per client IP (one every 2 s), plus a burst of
# 30 let through at once, so ~61 in the first minute. Sized for a demo where all team scripts and
# the browser share one address (Docker Desktop). Beyond it nginx answers 429 and the request
# never reaches the User Service (so refused attempts are not in the login log).
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

server {
    listen 80;
    root /usr/share/nginx/html;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- user-service: public path -> service route (rewritten) --------------------
    location = /api/v1/auth/login {
        limit_req zone=login burst=30 nodelay;
        limit_req_status 429;
        # Answer in the services' { error, message } shape so the login page can show the message
        error_page 429 = @login_too_many;
        proxy_pass http://user-service:3001/auth/login;
    }
    location @login_too_many {
        default_type application/json;
        return 429 '{"error":"TOO_MANY_REQUESTS","message":"Too many login attempts. Please wait a minute and try again."}';
    }
    location = /api/v1/auth/register { proxy_pass http://user-service:3001/auth/register; }
    location = /api/v1/whoami        { proxy_pass http://user-service:3001/whoami; }
    location ~ ^/api/v1/users/[^/]+/(suspend|restore)$ {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://user-service:3001;
    }
    location ~ ^/api/v1/admin/audit(/verify)?$ {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://user-service:3001;
    }
    location ~ ^/api/v1/admin/accounts(/[^/]+)?$ {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://user-service:3001;
    }
    location = /api/v1/admin/login-events {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://user-service:3001;
    }
    location ~ ^/api/v1/users/[^/]+/role$ {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://user-service:3001;
    }
    # /auth/verify is intentionally absent: only other services may call it.

    # ---- supplier-service: routes already match the public paths (no rewrite) ------
    location = /api/v1/suppliers { proxy_pass http://supplier-service:3000; }
    location /api/v1/suppliers/  { proxy_pass http://supplier-service:3000; }
    location = /assets/suppliers { proxy_pass http://supplier-service:3000; }
    location /assets/suppliers/  { proxy_pass http://supplier-service:3000; }

    # ---- order-service: public path -> service route (prefix stripped) -------------
    location /api/v1/errands {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://order-service:3002;
    }
    location /api/v1/admin/errands {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://order-service:3002;
    }

    # Any other /api path does not exist
    location = /api/v1/me/credit/transactions {
        proxy_pass http://credit-service:3003/me/credit/transactions;
    }
    location = /api/v1/me/credit {
        proxy_pass http://credit-service:3003/me/credit;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"No such endpoint"}';
    }

    # ---- the website itself -----------------------------------------------------
    # Client-side routes (e.g. /login) fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
