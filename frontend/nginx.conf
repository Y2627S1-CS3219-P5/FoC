# AI Assistance Disclosure: Claude Code (Claude Opus 5.5), 2026-09-26. Scope: nginx gateway
# implementing the author's routing decisions (single origin, data-named /api/v1 paths
# rewritten to service routes, /auth/verify not exposed). Author review: Reviewed and approved by @t-leongchuan
# Additional AI assistance: OpenAI Codex (GPT-6), 2026-09-27. Scope: made the
# bare Supplier asset route match the Vite gateway for issue #28.
# Author review: Reviewed and approved by @ron.
# Additional AI assistance: Claude Code (Claude Opus 5.5), 2026-10-10. Scope: routes for the
# User Service suspend/restore and admin audit endpoints. Author review: Reviewed and approved by @t-leongchuan
# Keep in sync with the dev proxy in vite.config.ts.

server {
    listen 80;
    root /usr/share/nginx/html;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- user-service: public path -> service route (rewritten) --------------------
    location = /api/v1/auth/login    { proxy_pass http://user-service:3001/auth/login; }
    location = /api/v1/auth/register { proxy_pass http://user-service:3001/auth/register; }
    location = /api/v1/whoami        { proxy_pass http://user-service:3001/whoami; }
    location ~ ^/api/v1/users/[^/]+/(suspend|restore)$ {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://user-service:3001;
    }
    location ~ ^/api/v1/admin/audit(/verify)?$ {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://user-service:3001;
    }
    location ~ ^/api/v1/users/[^/]+/role$ {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://user-service:3001;
    }
    # /auth/verify is intentionally absent: only other services may call it.

    # ---- supplier-service: routes already match the public paths (no rewrite) ------
    location = /api/v1/suppliers { proxy_pass http://supplier-service:3000; }
    location /api/v1/suppliers/  { proxy_pass http://supplier-service:3000; }
    location = /assets/suppliers { proxy_pass http://supplier-service:3000; }
    location /assets/suppliers/  { proxy_pass http://supplier-service:3000; }

    # Any other /api path does not exist
    location /api/ {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"No such endpoint"}';
    }

    # ---- the website itself -----------------------------------------------------
    # Client-side routes (e.g. /login) fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
