# AI Assistance Disclosure: OpenAI Codex (GPT-6), 2026-10-18.
# Scope: issue #49 AWS gateway route allowlist and lightweight health endpoint.
# Author review: PENDING.
# Contributor: @ron (AI-assisted); implementation review pending.
# Additional scope: issue #52 override the base image's inherited main logger.

# Deliberately omit query strings, bodies, and headers from completion logs.
log_format foc_safe '$remote_addr - $request_method $uri $server_protocol '
                    '$status $body_bytes_sent $request_time';

server {
    # Override, rather than append to, the base nginx.conf HTTP-level main log.
    access_log /var/log/nginx/access.log foc_safe;
    listen 80;
    root /usr/share/nginx/html;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Public User Service routes approved for the AWS User+Supplier slice.
    location = /api/v1/auth/login    { proxy_pass http://user-service:3001/auth/login; }
    location = /api/v1/auth/register { proxy_pass http://user-service:3001/auth/register; }
    location = /api/v1/whoami        { proxy_pass http://user-service:3001/whoami; }
    location ~ ^/api/v1/users/[^/]+/(suspend|restore)$ {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://user-service:3001;
    }
    location ~ ^/api/v1/admin/audit(/verify)?$ {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://user-service:3001;
    }
    location ~ ^/api/v1/users/[^/]+/role$ {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://user-service:3001;
    }

    # Public Supplier Service routes; internal health, Swagger, and /auth/verify
    # have no gateway route.
    location = /api/v1/suppliers { proxy_pass http://supplier-service:3000; }
    location /api/v1/suppliers/  { proxy_pass http://supplier-service:3000; }
    location = /assets/suppliers { proxy_pass http://supplier-service:3000; }
    location /assets/suppliers/  { proxy_pass http://supplier-service:3000; }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"No such endpoint"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
