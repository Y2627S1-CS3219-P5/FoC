# Additional AI assistance: OpenAI Codex (GPT-6), 2026-09-25. Scope: configured Supplier-to-User session verification for issue #16. Author review: Reviewed and approved by @ron.
# Additional AI assistance: OpenAI Codex (GPT-6), 2026-09-25. Scope: recorded the approved 1000 ms Supplier verification deployment timeout for issue #17. Author review of additional changes: Reviewed and approved by @ron.
# Additional AI assistance: OpenAI Codex (GPT-6), 2026-09-25. Scope: made the User Service host port configurable so the isolated Supplier integration smoke test can avoid a developer stack. Author review of additional changes: Reviewed and approved by @ron.
# Additional AI assistance: Claude Code (Claude Opus 5.5), 2026-09-26. Scope: added the frontend gateway service (nginx serving the React app and proxying /api/v1 to the services, per the User Service author's routing decisions). Author review: Reviewed and approved by @t-leongchuan.
# Additional AI assistance: Claude Code (Claude Opus 5.5), 2026-10-09. Scope: User Service database roles, the one-off user-migrate step and the user-db secrets from .env, per the User Service author's migration decisions. Author review: Reviewed and approved by @t-leongchuan.
# Additional AI assistance: Claude Code (Claude Opus 5.5), 2026-10-09. Scope: pinned the user-db Postgres image to a full version tag, per the User Service author's decision. Author review: Reviewed and approved by @t-leongchuan.
services:
  # Browser entry point: http://localhost:${FRONTEND_PORT:-8080}
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - user-service
      - supplier-service

  user-service:
    image: foc-user-service:local
    build: ./user-service
    init: true
    ports:
      - "${USER_PORT:-3001}:3001"
    environment:
      PORT: 3001
      # The app role: row access only, no schema changes
      DATABASE_URL: postgres://user_app:${USER_DB_APP_PASSWORD:?Set USER_DB_APP_PASSWORD in .env}@user-db:5432/users
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-u.nus.edu}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-1800}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      user-migrate:
        condition: service_completed_successfully

  # Applies user-service/migrations/*.sql, then exits. user-service starts only if it succeeds.
  user-migrate:
    image: foc-user-service:local
    pull_policy: never
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://user_migrator:${USER_DB_MIGRATION_PASSWORD:?Set USER_DB_MIGRATION_PASSWORD in .env}@user-db:5432/users
    depends_on:
      user-db:
        condition: service_healthy
    restart: "no"

  user-db:
    image: postgres:17.11-alpine3.24
    environment:
      # The superuser exists only to run the init script below; no service connects as it
      POSTGRES_USER: user_bootstrap
      POSTGRES_PASSWORD: ${USER_DB_ADMIN_PASSWORD:?Set USER_DB_ADMIN_PASSWORD in .env}
      POSTGRES_DB: users
      USER_DB_MIGRATION_PASSWORD: ${USER_DB_MIGRATION_PASSWORD:?Set USER_DB_MIGRATION_PASSWORD in .env}
      USER_DB_APP_PASSWORD: ${USER_DB_APP_PASSWORD:?Set USER_DB_APP_PASSWORD in .env}
    volumes:
      - user-db-data:/var/lib/postgresql/data
      - ./user-service/docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/010-user-roles.sh:ro
    healthcheck:
      # -h localhost checks over TCP, which the temporary server used during first-time
      # initialisation does not open; so the check only passes once the real server is up
      test: ["CMD-SHELL", "pg_isready -h localhost -U user_bootstrap -d users"]
      interval: 5s
      timeout: 3s
      retries: 10

  supplier-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SUPPLIER_DB_NAME:-supplier}
      POSTGRES_USER: ${SUPPLIER_DB_ADMIN_USER:-supplier_bootstrap}
      POSTGRES_PASSWORD: ${SUPPLIER_DB_ADMIN_PASSWORD:?Set SUPPLIER_DB_ADMIN_PASSWORD in .env}
      SUPPLIER_DB_MIGRATION_USER: ${SUPPLIER_DB_MIGRATION_USER:-supplier_migrator}
      SUPPLIER_DB_MIGRATION_PASSWORD: ${SUPPLIER_DB_MIGRATION_PASSWORD:?Set SUPPLIER_DB_MIGRATION_PASSWORD in .env}
      SUPPLIER_DB_USER: ${SUPPLIER_DB_USER:-supplier_app}
      SUPPLIER_DB_PASSWORD: ${SUPPLIER_DB_PASSWORD:?Set SUPPLIER_DB_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - supplier-db-data:/var/lib/postgresql/data
      - ./supplier-service/docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/010-supplier-roles.sh:ro

  supplier-migrate:
    image: foc-supplier-service:local
    build:
      context: .
      dockerfile: supplier-service/Dockerfile
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${SUPPLIER_DB_MIGRATION_USER:-supplier_migrator}:${SUPPLIER_DB_MIGRATION_PASSWORD:?Set SUPPLIER_DB_MIGRATION_PASSWORD in .env}@supplier-db:5432/${SUPPLIER_DB_NAME:-supplier}
      DATABASE_RUNTIME_ROLE: ${SUPPLIER_DB_USER:-supplier_app}
    depends_on:
      supplier-db:
        condition: service_healthy
    restart: "no"

  supplier-service:
    image: foc-supplier-service:local
    pull_policy: never
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${SUPPLIER_DB_USER:-supplier_app}:${SUPPLIER_DB_PASSWORD:?Set SUPPLIER_DB_PASSWORD in .env}@supplier-db:5432/${SUPPLIER_DB_NAME:-supplier}
      SUPPLIER_SEED_CSV_PATH: /data/csv/supplier-seed-data.csv
      USER_SERVICE_BASE_URL: http://user-service:3001
      USER_SERVICE_VERIFY_TIMEOUT_MS: ${USER_SERVICE_VERIFY_TIMEOUT_MS:-1000}
    depends_on:
      supplier-migrate:
        condition: service_completed_successfully
    ports:
      - "${SUPPLIER_PORT:-3000}:3000"

volumes:
  user-db-data:
  supplier-db-data:
